name: GoRest API CI/CD Testing

on:
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Newman & HTML Reporter
        run: |
          npm install -g newman
          npm install -g newman-reporter-htmlextra

      - name: Run Postman Collection (Data-Driven with users.csv)
        env:
          TOKEN: ${{ secrets.GOREST_TOKEN }}
        run: |
          newman run *.json -e *Env*.json -d users.csv --env-var "token=$TOKEN" -r cli,htmlextra --reporter-htmlextra-export report.html

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gorest-test-report
          path: report.html
